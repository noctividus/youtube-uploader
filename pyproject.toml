[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vmix-youtube-uploader"
version = "0.1.0"
description = "Windows tray vMix recording review and approved YouTube uploads"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8,<7", "watchdog>=6,<7", "requests>=2.32,<3",
    "google-api-python-client>=2.201,<3", "google-auth-oauthlib>=1.2,<2",
    "google-auth-httplib2>=0.4.4,<1", "httplib2>=0.32,<1", "keyring>=25,<26",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
build = ["pyinstaller==6.22.3", "pyinstaller-hooks-contrib==2026.8"]

[project.gui-scripts]
vmix-youtube-uploader = "vmix_youtube_uploader.main:main"

[tool.setuptools.packages.find]
include = ["vmix_youtube_uploader*"]

[tool.setuptools.package-data]
vmix_youtube_uploader = ["assets/*.svg", "assets/*.png", "assets/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
